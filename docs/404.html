<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sendaway</title>
    <script type="text/javascript">
      var pathname = window.location.pathname;
      if (!pathname.endsWith('/') && !pathname.includes('.')) {
        window.location.replace(pathname + '/' + window.location.search + window.location.hash);
      } else {
        var segments = pathname.split('/').filter(Boolean);
        var base = segments.length > 0 ? '/' + segments[0] + '/' : '/';
        window.location.replace(base + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Sendaway...</p>
  </body>
</html>
